services:
  android-build:
    build:
      context: .
      dockerfile: Dockerfile.android
    platform: linux/amd64
    working_dir: /app
    environment:
      CI: "1"
    volumes:
      - .:/app
      - android-node-modules:/app/node_modules
      - android-native-dir:/app/android
      - android-gradle-cache:/root/.gradle
      - android-sdk-cache:/opt/android-sdk
      - ./dist:/out
    command: >
      sh -c '
        set -e
        npm ci
        npx expo prebuild --platform android --clean --no-install
        cd android
        ./gradlew assembleRelease
        VERSION=$(node -p "require(\"/app/package.json\").version")
        mkdir -p /out
        cp app/build/outputs/apk/release/app-release.apk "/out/palan-arivom-v$${VERSION}.apk"
        echo "Built /out/palan-arivom-v$${VERSION}.apk"
      '

volumes:
  android-node-modules:
  android-native-dir:
  android-gradle-cache:
  android-sdk-cache:
