services:
  android-build:
    build:
      context: .
      dockerfile: Dockerfile.android
    platform: linux/amd64
    working_dir: /work
    environment:
      CI: "1"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true -Xmx3g"
    volumes:
      - .:/src
      - android-node-modules:/work/node_modules
      - android-gradle-cache:/root/.gradle
      - android-sdk-cache:/opt/android-sdk
    command: bash /src/scripts/build-android.sh

volumes:
  android-node-modules:
  android-gradle-cache:
  android-sdk-cache:
